<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HairLab — Клиентский хаб</title>
<style>
  body{
    margin:0;
    background: linear-gradient(180deg, #0d2bd7 0%, #143bdb 100%);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff;
  }
  .wrap{ max-width: 820px; margin:0 auto; padding: 18px 16px 90px; }
  .top{
    margin: 10px 2px 18px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  .brand{ font-size:18px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
  .sub{ font-size:12px; opacity:.85; margin-top:4px; line-height:1.35; }
  .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 14px; border-radius:999px;
    background: rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    color:#fff; text-decoration:none; font-weight:700; font-size:13px;
    white-space:nowrap;
  }
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
  }
  .card{
    text-decoration:none; color:#fff;
    background: rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius: 18px;
    padding: 16px 14px;
    min-height: 92px;
    display:flex; flex-direction:column; justify-content:space-between;
    box-shadow: 0 12px 28px rgba(0,0,0,.22);
  }
  .t{ font-weight:800; letter-spacing:.02em; }
  .d{ font-size:12px; opacity:.82; margin-top:6px; line-height:1.35; }
  .tag{ margin-top:10px; font-size:11px; opacity:.75; }
  .full{ grid-column: 1 / -1; }
  .footer{ margin-top: 18px; text-align:center; font-size:11px; opacity:.65; }
  @media (max-width:520px){ .grid{ grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="brand">Hair Lab</div>
        <div class="sub">Клиентский хаб<br/>Томск — Розы Люксембург, 4В</div>
      </div>
      <a class="pill" href="index.html">Прайсы →</a>
    </div>

    <!-- Карточки рендерятся из hub-data.js -->
    <div id="hubGrid" class="grid"></div>

    <div class="footer">Hair Lab · Красивые волосы без компромиссов</div>
  </div>

  <!-- Конфиг -->
  <script src="hub-data.js"></script>

  <!-- Рендер -->
  <script>
    (function () {
      const data = window.HAIRLAB_HUB;
      if (!data) return;

      const brand = document.querySelector(".brand");
      const sub = document.querySelector(".sub");
      const pill = document.querySelector(".pill");
      const grid = document.getElementById("hubGrid");

      if (brand) brand.textContent = data.title || "Hair Lab";
      if (sub) sub.innerHTML = (data.subtitle || "").replace(/\n/g, "<br/>");

      if (pill && data.topLink) {
        pill.textContent = data.topLink.text || "Прайсы →";
        pill.href = data.topLink.href || "index.html";
      }

      if (!grid) return;

      grid.innerHTML = (data.cards || []).map(c => {
        const cls = "card" + (c.full ? " full" : "");
        const attrs = c.external ? ' target="_blank" rel="noopener"' : "";
        return `
          <a class="${cls}" href="${c.href || "#"}"${attrs}>
            <div>
              <div class="t">${c.title || ""}</div>
              <div class="d">${c.desc || ""}</div>
            </div>
            <div class="tag">${c.tag || ""}</div>
          </a>
        `;
      }).join("");
    })();
  </script>
</body>
</html>
