<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HairLab — Клиентский хаб</title>

<style>
  :root{
    --bg1:#0d2bd7;
    --bg2:#143bdb;
    --glass: rgba(5,12,60,0.45);
    --card: rgba(255,255,255,0.08);
    --stroke: rgba(255,255,255,0.15);
    --stroke2: rgba(255,255,255,0.22);
    --text: #fff;
    --muted: rgba(255,255,255,.82);
  }

  body{
    margin:0;
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 920px; margin:0 auto; padding: 18px 16px 90px; }

  /* top bar like index.html nav */
  .topbar{
    position: sticky;
    top: 10px;
    z-index: 1000;
    margin: 10px auto 18px;
    padding: 10px 12px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    background: var(--glass);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.10);
  }

  .brand{
    font-size:18px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin:0;
  }
  .sub{
    font-size:12px;
    opacity:.85;
    margin-top:6px;
    line-height:1.35;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border-radius:999px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.20);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:13px;
    white-space:nowrap;
    user-select:none;
  }
  .pill:active{ transform: translateY(1px); }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 0 2px;
    margin-top: 14px;
  }

  .card{
    text-decoration:none;
    color:#fff;
    background: var(--card);
    border:1px solid var(--stroke);
    border-radius: 16px;
    padding: 16px 14px;
    min-height: 98px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    box-shadow: 0 12px 28px rgba(0,0,0,.22);
    overflow:hidden;
  }

  .t{ font-weight:800; letter-spacing:.02em; font-size:14px; }
  .d{ font-size:12px; opacity:.82; margin-top:8px; line-height:1.4; }

  .tag{
    margin-top:12px;
    font-size:11px;
    opacity:.86;
    display:inline-flex;
    width: fit-content;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.18);
  }

  .full{ grid-column: 1 / -1; }

  .footer{
    margin-top: 22px;
    text-align:center;
    font-size:11px;
    opacity:.65;
  }

  @media (max-width:560px){
    .grid{ grid-template-columns: 1fr; }
    .topbar{ top: 8px; }
  }
</style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">Hair Lab</div>
        <div class="sub">Клиентский хаб<br/>Томск — Розы Люксембург, 4В</div>
      </div>
      <a class="pill" href="index.html">Прайсы →</a>
    </div>

    <div id="hubGrid" class="grid"></div>

    <div class="footer">Hair Lab · Красивые волосы без компромиссов</div>
  </div>

  <script src="hub-data.js"></script>

  <script>
    (function () {
      const data = window.HAIRLAB_HUB;
      if (!data) return;

      const brand = document.querySelector(".brand");
      const sub = document.querySelector(".sub");
      const pill = document.querySelector(".pill");
      const grid = document.getElementById("hubGrid");

      if (brand) brand.textContent = data.title || "Hair Lab";
      if (sub) sub.innerHTML = (data.subtitle || "").replace(/\n/g, "<br/>");

      if (pill && data.topLink) {
        pill.textContent = data.topLink.text || "Прайсы →";
        pill.href = data.topLink.href || "index.html";
      }

      if (!grid) return;

      grid.innerHTML = (data.cards || []).map(c => {
        const cls = "card" + (c.full ? " full" : "");
        const attrs = c.external ? ' target="_blank" rel="noopener"' : "";
        return `
          <a class="${cls}" href="${c.href || "#"}"${attrs}>
            <div>
              <div class="t">${c.title || ""}</div>
              <div class="d">${c.desc || ""}</div>
            </div>
            <div class="tag">${c.tag || ""}</div>
          </a>
        `;
      }).join("");
    })();
  </script>
</body>
</html>
