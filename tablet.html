<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HairLab A5 Tablet</title>
    <style>
        @media print { @page { margin: 0; size: A5; } }
        
        body {
            margin: 0;
            padding: 0;
            background: #143bdb; /* Фирменный синий из вашего стиля */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            width: 148mm;
            height: 210mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
        }

        /* ЛОГОТИП (как в PDF) */
        .logo-container {
            margin-top: 25mm;
            text-align: center;
        }
        .logo-hair {
            color: #e28bc7; /* Розовый из лого */
            font-size: 56px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .logo-lab {
            color: #ffffff;
            font-size: 56px;
            font-weight: 300;
            margin-left: -5px;
            font-style: italic;
        }

        .welcome-text {
            margin-top: 10mm;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.9;
        }

        /* СЕКЦИИ */
        .content-sections {
            width: 85%;
            margin-top: 15mm;
        }

        .section {
            border-top: 1px solid rgba(255,255,255,0.3);
            padding: 15px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-info {
            flex: 1;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .section-desc {
            font-size: 13px;
            opacity: 0.7;
            line-height: 1.4;
        }

        /* Квадраты под QR-коды */
        .qr-placeholder {
            width: 32mm;
            height: 32mm;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 20px;
        }

        .qr-placeholder img {
            width: 90%;
            height: 90%;
        }

        .wifi-info {
            margin-top: 20mm;
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            width: 80%;
        }

        .wifi-data {
            font-size: 14px;
            font-family: monospace;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <span class="logo-hair">HAIR</span><span class="logo-lab">lab</span> 
    </div>

    <div class="welcome-text">Добро пожаловать 🕊</div>

    <div class="content-sections">
        <div class="section">
            <div class="section-info">
                <div class="section-title">Барное меню</div>
                <div class="section-desc">Напитки, полный прайс процедур и квиз-тест на подбор ухода</div>
            </div>
            <div class="qr-placeholder">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://hairlab1.github.io/menu.html" alt="QR Menu">
            </div>
        </div>

        <div class="section">
            <div class="section-info">
                <div class="section-title">Мгновенный Wi-Fi</div>
                <div class="section-desc">Наведите камеру для автоматического подключения к сети</div>
            </div>
            <div class="qr-placeholder">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=WIFI:S:wifi_zdorovogo_cheloveka;T:WPA;P:88884444;;" alt="QR WiFi">
            </div>
        </div>
    </div>

    <div class="wifi-info">
        <div style="font-size: 11px; text-transform: uppercase; margin-bottom: 5px; opacity: 0.6;">Данные для входа вручную:</div>
        <div class="wifi-data">СЕТЬ: wifi_zdorovogo_cheloveka</div>
        <div class="wifi-data">ПАРОЛЬ: 88884444</div>
    </div>

    <div style="margin-top: auto; padding-bottom: 10mm; font-size: 12px; opacity: 0.5;">
        hairlab1.github.io
    </div>

</body>
</html>
