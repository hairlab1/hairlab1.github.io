<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Lab — Получить подарок</title>

<style>
body {
  margin: 0;
  background: #f4f1ec;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color: #6b5b4b;
}

.wrapper {
  max-width: 600px;
  margin: 0 auto;
  padding: 28px 18px 60px;
}

h1 {
  font-size: 28px;
  text-transform: uppercase;
  line-height: 1.2;
  margin-bottom: 20px;
}

.steps {
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 28px;
}

.steps span {
  display: block;
  margin-bottom: 12px;
}

.gift-box {
  background: #ebe5de;
  border-radius: 18px;
  padding: 24px;
  text-align: center;
  margin-bottom: 26px;
  font-weight: 600;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.buttons a {
  display: block;
  text-align: center;
  padding: 18px;
  border: 2px solid #6b5b4b;
  border-radius: 16px;
  text-decoration: none;
  color: #6b5b4b;
  font-weight: 600;
  background: transparent;
}

.note {
  margin-top: 24px;
  font-size: 13px;
  opacity: .7;
  text-align: center;
}

.back {
  margin-top: 36px;
  text-align: center;
}

.back a {
  color: #6b5b4b;
  text-decoration: none;
  font-size: 14px;
}
</style>
</head>

<body>
<div class="wrapper">

<h1>Получи подарок<br>от нас прямо сейчас</h1>

<div class="steps">

</div>

<div class="gift-box">
  🎁 Подарочек от нашей студии — твой
</div>

<div class="buttons">
  <a href="https://yandex.ru/maps" target="_blank">Яндекс Карты</a>
  <a href="https://2gis.ru" target="_blank">2GIS</a>
  <a href="https://yclients.com" target="_blank">Yclients</a>
</div>

<div class="note">
  Это наш способ сказать тебе спасибо за честную обратную связь

<div class="back">

</div>

</div>
