<!-- ============ MODAL ============ -->
<div id="imageModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Просмотр прайса" aria-hidden="true">
  <div class="modal-inner">
    <button class="modal-close" type="button" aria-label="Закрыть">×</button>
    <button class="modal-nav modal-prev" type="button" aria-label="Предыдущее изображение">‹</button>
    <button class="modal-nav modal-next" type="button" aria-label="Следующее изображение">›</button>
    <img id="modalImage" alt="">
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  /* бургер */
  const burger = document.getElementById("navBurger");
  const links = document.getElementById("navLinks");
  const setNavOpen = open => {
    links.classList.toggle("open", open);
    burger.setAttribute("aria-expanded", String(open));
    burger.setAttribute("aria-label", open ? "Закрыть меню" : "Открыть меню");
  };
  burger.addEventListener("click", e => { e.stopPropagation(); setNavOpen(!links.classList.contains("open")); });
  links.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setNavOpen(false)));
  document.addEventListener("click", e => { if (!links.contains(e.target) && e.target !== burger) setNavOpen(false); });

  /* вкладки */
  const tabs = [...document.querySelectorAll(".tabs button")];
  const ids = ["viypr","uhods","okrash"];
  const secs = ids.map(id => document.getElementById(id));
  let autoScroll = false;
  function setActive(id){ tabs.forEach(b => {
    const active = b.dataset.target === id;
    b.classList.toggle("active", active);
    b.setAttribute("aria-pressed", String(active));
  }); }
  setActive("viypr");
  tabs.forEach(btn => btn.addEventListener("click", () => {
    autoScroll = true; setTimeout(() => autoScroll = false, 700);
    const el = document.getElementById(btn.dataset.target);
    const y = el.getBoundingClientRect().top + window.pageYOffset - 150;
    window.scrollTo({ top:y, behavior:"smooth" });
    setActive(btn.dataset.target);
  }));
  const obs = new IntersectionObserver(ents => {
    if (autoScroll) return;
    const vis = ents.filter(e => e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if (vis?.target?.id) setActive(vis.target.id);
  }, { rootMargin:"-35% 0px -55% 0px", threshold:[0.01,0.1,0.25,0.5] });
  secs.forEach(s => obs.observe(s));

  /* плавное появление картинок */
  document.querySelectorAll(".price-card img").forEach(img => {
    if (img.complete) img.classList.add("loaded");
    else img.addEventListener("load", () => img.classList.add("loaded"));
  });

  /* модалка */
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");
  const cards = [...document.querySelectorAll(".price-card")];
  const imgs = [...document.querySelectorAll(".price-card img")];
  let index = 0;
  let lastFocus = null;
  const show = i => {
    if (i<0) i = imgs.length-1;
    if (i>=imgs.length) i = 0;
    index = i;
    modalImg.src = imgs[index].dataset.full || imgs[index].src;
    modalImg.alt = imgs[index].alt;
  };
  cards.forEach((card,i) => card.addEventListener("click", () => {
    lastFocus = document.activeElement;
    show(i);
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow="hidden";
    document.querySelector(".modal-close").focus();
  }));
  const close = () => {
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow="";
    if (lastFocus) lastFocus.focus();
  };
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  document.querySelector(".modal-prev").onclick = e => { e.stopPropagation(); show(index-1); };
  document.querySelector(".modal-next").onclick = e => { e.stopPropagation(); show(index+1); };
  document.querySelector(".modal-close").onclick = e => { e.stopPropagation(); close(); };
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") setNavOpen(false);
    if (!modal.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(index-1);
    if (e.key === "ArrowRight") show(index+1);
  });
});
</script>
