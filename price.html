<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f3e8d6'/%3E%3Cg stroke='%233c352d' stroke-width='2.4' fill='none' stroke-linecap='round'%3E%3Ccircle cx='10' cy='22' r='3.4'/%3E%3Ccircle cx='22' cy='22' r='3.4'/%3E%3Cpath d='M12 19l10-12M20 19L10 7' stroke='%23d27050'/%3E%3C/g%3E%3C/svg%3E">

<style>
/* --- компактный прайс-хаб --- */
.price-head{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  margin:18px 0 6px;
}
.price-head .ttl{ flex:1; min-width:200px; }
.price-head .ttl h1{ font-size:clamp(26px,4vw,38px); color:var(--on-bg-strong); }
.price-head .ttl .script{ font-family:"Caveat",cursive; color:var(--terra); font-size:24px; line-height:1; }

/* липкие вкладки */
.tabs{
  position:sticky; top:80px; z-index:900;
  display:flex; gap:8px; flex-wrap:wrap;
  padding:10px;
  margin:8px 0 26px;
  background:color-mix(in srgb, var(--card) 90%, transparent);
  border:2px solid var(--stroke-ink);
  border-radius:999px;
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(8px);
  width:fit-content;
}
.tabs button{
  border:2px solid transparent;
  background:transparent;
  color:var(--ink);
  font-family:"Nunito",sans-serif;
  font-weight:800; font-size:14px;
  padding:8px 16px; border-radius:999px; cursor:pointer;
  transition:background .2s,color .2s;
}
.tabs button:hover{ background:rgba(210,112,80,.12); }
.tabs button.active{ background:var(--terra); color:#fff; }

.cat-block{ scroll-margin-top:150px; margin-bottom:46px; }
.cat-label{ display:flex; align-items:center; gap:12px; margin:0 0 18px; }
.cat-label h2{ font-size:24px; white-space:nowrap; color:var(--on-bg-strong); }
.cat-label .line{ flex:1; height:2px; background:var(--stroke); border-radius:2px; }
.cat-label .pin{ width:14px; height:14px; border-radius:50%; }

.price-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}
.price-card{
  background:var(--card);
  border:2px solid var(--stroke-ink);
  border-radius:var(--r-md);
  overflow:hidden;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .18s, box-shadow .18s;
}
.price-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
.price-card img{ width:100%; display:block; opacity:0; transition:opacity .4s; }
.price-card img.loaded{ opacity:1; }
</style>
</head>

<body>

<!-- ============ NAV ============ -->
<nav class="nav">
  <a href="index.html" class="nav-brand">Hair Lab</a>
  <div class="nav-burger" id="navBurger">☰</div>
  <div class="nav-links" id="navLinks">
    <a href="index.html#studio">Студия</a>
    <a href="index.html#masters">Мастера</a>
    <a href="index.html#reviews">Отзывы</a>
    <a href="index.html#contacts">Контакты</a>
    <a href="https://n92404.yclients.com" target="_blank" rel="noopener" class="nav-cta">Записаться</a>
  </div>
</nav>

<div class="wrap">

  <div class="price-head">
    <div class="ttl">
      <div class="script">прайс под рукой</div>
      <h1>Услуги и цены</h1>
    </div>
    <a href="index.html" class="btn btn-ghost">← На главную</a>
  </div>

  <div class="tabs">
    <button data-target="viypr" class="active">Выпрямление</button>
    <button data-target="uhods">Уходы и стрижки</button>
    <button data-target="okrash">Окрашивание</button>
  </div>

  <!-- ВЫПРЯМЛЕНИЕ -->
  <section id="viypr" class="cat-block">
    <div class="cat-label"><span class="pin" style="background:var(--terra)"></span><h2>Выпрямление / Разглаживание</h2><span class="line"></span></div>
    <div class="price-grid">
      <div class="price-card"><img src="PriceMay2026/Botox.jpg" alt="Ботокс для волос" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Bixisplatia.jpg" alt="Биксипластия" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Collagen.jpg" alt="Коллагеновое выпрямление" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Keratin.jpg" alt="Кератиновое выпрямление" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Nanoplastica.jpg" alt="Нанопластика волос" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Totalinfo.jpg" alt="Тотальная реконструкция — описание" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/TotalPrice.jpg" alt="Тотальная реконструкция — стоимость" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Obodok.jpg" alt="Обработка височной зоны" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Brazilian.jpg" alt="Бразильское выпрямление" loading="lazy"></div>
    </div>
  </section>

  <!-- УХОДЫ -->
  <section id="uhods" class="cat-block">
    <div class="cat-label"><span class="pin" style="background:var(--teal)"></span><h2>Уходы + Стрижки</h2><span class="line"></span></div>
    <div class="price-grid">
      <div class="price-card"><img src="PriceMay2026/Holodnoe.jpg" alt="Холодное восстановление" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Schastie.jpg" alt="Счастье для волос" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/DiagnostikaPilig.jpg" alt="Пилинг и диагностика кожи головы" loading="lazy"></div>
      <div class="price-card"><img src="PriceMay2026/Polirovka.jpg" alt="Полировка волос" loading="lazy"></div>

    </div>

  <!-- ОКРАШИВАНИЕ -->
  <section id="okrash" class="cat-block">

    <div class="price-grid">
      <div class="price-card"><img src="PriceMay2026/Okrashivanie.jpg" alt="Тонирование и окрашивание" loading="lazy"></div>

    </div>

  <div class="center" style="margin:10px 0 40px;">
    <a href="https://n92404.yclients.com" target="_blank" rel="noopener" class="btn btn-primary">Записаться онлайн</a>

</div>

<!-- ============ MODAL ============ -->
<div id="imageModal" class="modal-overlay">
  <div class="modal-inner">
    <div class="modal-close">×</div>
    <div class="modal-nav modal-prev">‹</div>
    <div class="modal-nav modal-next">›</div>
    <img id="modalImage" alt="">
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  /* бургер */
  const burger = document.getElementById("navBurger");
  const links = document.getElementById("navLinks");
  burger.addEventListener("click", e => { e.stopPropagation(); links.classList.toggle("open"); });
  document.addEventListener("click", e => { if (!links.contains(e.target) && e.target !== burger) links.classList.remove("open"); });

  /* вкладки */
  const tabs = [...document.querySelectorAll(".tabs button")];
  const ids = ["viypr","uhods","okrash"];
  const secs = ids.map(id => document.getElementById(id));
  let autoScroll = false;
  function setActive(id){ tabs.forEach(b => b.classList.toggle("active", b.dataset.target === id)); }
  tabs.forEach(btn => btn.addEventListener("click", () => {
    autoScroll = true; setTimeout(() => autoScroll = false, 700);
    const el = document.getElementById(btn.dataset.target);
    const y = el.getBoundingClientRect().top + window.pageYOffset - 150;
    window.scrollTo({ top:y, behavior:"smooth" });
    setActive(btn.dataset.target);
  }));
  const obs = new IntersectionObserver(ents => {
    if (autoScroll) return;
    const vis = ents.filter(e => e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if (vis?.target?.id) setActive(vis.target.id);
  }, { rootMargin:"-35% 0px -55% 0px", threshold:[0.01,0.1,0.25,0.5] });
  secs.forEach(s => obs.observe(s));

  /* плавное появление картинок */
  document.querySelectorAll(".price-card img").forEach(img => {
    if (img.complete) img.classList.add("loaded");
    else img.addEventListener("load", () => img.classList.add("loaded"));
  });

  /* модалка */
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");
  const imgs = [...document.querySelectorAll(".price-card img")];
  let index = 0;
  const show = i => { if (i<0) i = imgs.length-1; if (i>=imgs.length) i = 0; index = i; modalImg.src = imgs[index].src; };
  imgs.forEach((img,i) => img.addEventListener("click", () => { show(i); modal.classList.add("open"); document.body.style.overflow="hidden"; }));
  const close = () => { modal.classList.remove("open"); document.body.style.overflow=""; };
  modal.addEventListener("click", close);
  document.querySelector(".modal-prev").onclick = e => { e.stopPropagation(); show(index-1); };
  document.querySelector(".modal-next").onclick = e => { e.stopPropagation(); show(index+1); };
  document.querySelector(".modal-close").onclick = e => { e.stopPropagation(); close(); };
  document.addEventListener("keydown", e => {
    if (!modal.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(index-1);
    if (e.key === "ArrowRight") show(index+1);
  });
});
</script>

</body>
</html>
