<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Lab — Прайс со скидкой</title>

<style>
:root {
    --blue-main: #3F54E3;
    --blue-dark: #2F3FC8;
    --blue-light: #5167F0;
    --pink-accent: #F2A3C7;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #ffffff;
    background:
        radial-gradient(1200px 600px at 20% -10%, rgba(255,255,255,0.12), transparent 40%),
        radial-gradient(900px 500px at 80% 10%, rgba(255,255,255,0.08), transparent 45%),
        linear-gradient(180deg, var(--blue-light) 0%, var(--blue-main) 45%, var(--blue-dark) 100%);
    background-attachment: fixed;
}

/* ===== LAYOUT ===== */
.wrapper {
    max-width: 420px;   /* 🔑 ключевой момент */
    margin: 0 auto;
    padding-bottom: 120px;
}

/* ===== HEADER ===== */
.header {
    padding: 22px 16px 14px;
    text-align: center;
}

.header-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.header-sub {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 6px;
}

/* ===== NOTICE ===== */
.notice {
    margin: 14px 16px 20px;
    padding: 14px 16px;
    font-size: 12px;
    text-align: center;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 14px;
    backdrop-filter: blur(8px);
}

/* ===== PRICE LIST ===== */
.price-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 0 16px;
}

.price-item {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.price-item img {
    width: 100%;
    display: block;
}

/* ===== ACTIONS ===== */
.actions {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 32px 16px 0;
}

.actions a {
    text-decoration: none;
}

.action-btn {
    padding: 18px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #ffffff;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    backdrop-filter: blur(10px);
}

.action-btn:active {
    transform: scale(0.97);
}

/* ===== FOOTER ===== */
.footer {
    margin: 40px 16px 20px;
    text-align: center;
    font-size: 11px;
    opacity: 0.65;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="header">
        <div class="header-title">Hair Lab</div>
        <div class="header-sub">Прайс со скидкой для клиентов</div>
    </div>

    <div class="notice">
        Цены указаны с учётом персональной скидки<br>
        <span style="color:var(--pink-accent)">Окончательная стоимость зависит от длины и густоты волос</span>
    </div>

    <!-- 🔵 ПОЛНЫЙ ПРАЙС (в правильном порядке) -->
    <div class="price-list">
        <div class="price-item"><img src="1 Измерение.jpg" alt=""></div>
        <div class="price-item"><img src="2 Ботокс.jpg" alt=""></div>
        <div class="price-item"><img src="3 Биксипластия.jpg" alt=""></div>
        <div class="price-item"><img src="4 Коллаген.jpg" alt=""></div>
        <div class="price-item"><img src="5 Кератин.jpg" alt=""></div>
        <div class="price-item"><img src="6 Тотальная описание.jpg" alt=""></div>
        <div class="price-item"><img src="7 Тотальная стоимость.jpg" alt=""></div>
        <div class="price-item"><img src="8 Нанопластика.jpg" alt=""></div>
        <div class="price-item"><img src="9 Холодное.jpg" alt=""></div>
        <div class="price-item"><img src="10 Счастье.jpg" alt=""></div>
        <div class="price-item"><img src="11 Пилинг диагностика.jpg" alt=""></div>
        <div class="price-item"><img src="12 Полировка.jpg" alt=""></div>
        <div class="price-item"><img src="13 Височная зона.jpg" alt=""></div>
        <div class="price-item"><img src="14 Стрижка.jpg" alt=""></div>
        <div class="price-item"><img src="15 Тонирование.jpg" alt=""></div>
        <div class="price-item"><img src="16 Адорн.jpg" alt=""></div>
        <div class="price-item"><img src="17 Бразилиан.jpg" alt=""></div>
        <div class="price-item"><img src="18 Биозавивка.jpg" alt=""></div>
    </div>

    <div class="actions">
        <a href="https://t.me/hairlab_tomsk" target="_blank">
            <div class="action-btn">Записаться</div>
        </a>
        <a href="index.html">
            <div class="action-btn">Вернуться в меню</div>
        </a>
    </div>

    <div class="footer">
        Hair Lab · Профессиональная реконструкция волос
    </div>

</div>

</body>
</html>
