<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HairLab — Прайсы</title>

<style>
/* === БАЗОВЫЕ СТИЛИ === */
body {
    margin: 0;
    background: linear-gradient(180deg, #0d2bd7 0%, #143bdb 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #ffffff;
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
}

.content {
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
    padding-bottom: 120px;
}

/* === GLASS НАВИГАЦИЯ === */
.nav {
    position: sticky;
    top: max(6px, env(safe-area-inset-top));
    z-index: 999;
    margin: 12px auto 0;
    padding: 6px 10px;
    display: flex;
    overflow-x: auto;
    background: rgba(5,12,60,0.45);
    border-radius: 22px;
    width: fit-content;
    max-width: 98%;
    box-shadow: 0 8px 16px rgba(0,0,0,0.22);
    backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.18);
}
.nav::-webkit-scrollbar { display: none; }

.nav button {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.20);
    padding: 8px 12px;
    border-radius: 999px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    margin-right: 6px;
}
.nav button.active {
    background: rgba(255,255,255,0.26);
    border-color: rgba(255,255,255,0.45);
}

/* === ШАПКА === */
.address-bar {
    margin: 18px 18px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.address-brand {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}
.address-sub { font-size: 11px; opacity: 0.8; }
.address-line { font-size: 12px; opacity: 0.85; }

/* === СЕКЦИИ === */
.section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 32px 18px 6px;
}
.section-marker {
    width: 6px;
    height: 22px;
    border-radius: 999px;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 0 12px rgba(255,255,255,0.7);
}
.section-header h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}
.section-header::after {
    content: "";
    flex: 1;
    height: 1px;
    margin-left: 12px;
    background: rgba(255,255,255,0.30);
}

.intro {
    width: 94%;
    margin: 20px auto 30px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}
.intro img { width: 100%; display: block; }

/* === GRID === */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 0 16px;
}
.card {
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}
.card:active { transform: scale(0.97); }
.card img { width: 100%; display: block; }

/* === FOOTER === */
.footer-note {
    margin: 40px 18px 20px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.65);
}
</style>
</head>

<body>

<div class="content">

    <div class="nav">
        <button data-target="viypr">Выпрямление</button>
        <button data-target="uhods">Уходы</button>
        <button data-target="okrash">Окрашивание</button>
    </div>

    <div class="address-bar">
        <div class="address-brand">Hair Lab</div>
        <div class="address-sub">Первая студия по реконструкции волос</div>
        <div class="address-line">Томск — Розы Люксембург, 4В — 4 этаж</div>
    </div>

    <main>

        <div class="intro">
            <img src="19 Презентация.jpg" alt="">
        </div>

        <section id="viypr" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Выпрямление / Разглаживание</h2></div>
            <div class="grid">
                <div class="card"><img src="2 Ботокс.jpg"></div>
                <div class="card"><img src="3 Биксипластия.jpg"></div>
                <div class="card"><img src="4 Коллаген.jpg"></div>
                <div class="card"><img src="5 Кератин.jpg"></div>
                <div class="card"><img src="6 Тотальная описание.jpg"></div>
                <div class="card"><img src="7 Тотальная стоимость.jpg"></div>
                <div class="card"><img src="13 Височная зона.jpg"></div>
                <div class="card"><img src="8 Нанопластика.jpg"></div>
                <div class="card"><img src="17 Бразилиан.jpg"></div>
            </div>
        </section>

        <section id="uhods" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Уходы / Стрижки</h2></div>
            <div class="grid">
                <div class="card"><img src="9 Холодное.jpg"></div>
                <div class="card"><img src="10 Счастье.jpg"></div>
                <div class="card"><img src="16 Адорн.jpg"></div>
                <div class="card"><img src="11 Пилинг диагностика.jpg"></div>
                <div class="card"><img src="12 Полировка.jpg"></div>
                <div class="card"><img src="14 Стрижка.jpg"></div>
            </div>
        </section>

        <section id="okrash" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Окрашивание</h2></div>
            <div class="grid">
                <div class="card"><img src="15 Тонирование.jpg"></div>
                <div class="card"><img src="18 Биозавивка.jpg"></div>
            </div>
        </section>

        <div class="footer-note">
            Hair Lab · Томск · Красивые волосы без компромиссов
        </div>

    </main>
</div>

</body>
</html>
