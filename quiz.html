<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HairLab — Подбор процедуры</title>

<style>
    /* БАЗОВЫЙ СТИЛЬ (СИНХРОННО С INDEX) */
    body {
        margin: 0;
        background: linear-gradient(180deg, #0d2bd7 0%, #143bdb 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .content {
        width: 100%;
        max-width: 500px;
        padding: 20px;
        box-sizing: border-box;
    }

    .header {
        text-align: center;
        margin: 20px 0 30px;
    }

    .header h1 {
        font-size: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0;
    }

    /* КАРТОЧКА КВИЗА */
    .quiz-card {
        background: rgba(255,255,255,0.08);
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 25px;
        min-height: 350px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .question-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 25px;
        line-height: 1.4;
        text-align: center;
    }

    .options-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .option-btn {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 16px;
        border-radius: 14px;
        color: #fff;
        text-align: left;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .option-btn:hover {
        background: rgba(255,255,255,0.2);
    }

    /* РЕЗУЛЬТАТ */
    #result-screen { display: none; text-align: center; }
    
    .result-title {
        font-size: 22px;
        color: #e28bc7;
        font-weight: 800;
        margin-bottom: 15px;
        text-transform: uppercase;
    }

    .result-desc {
        font-size: 14px;
        line-height: 1.6;
        opacity: 0.9;
        margin-bottom: 20px;
        text-align: left;
    }

    .care-tip {
        background: rgba(226, 139, 199, 0.15);
        border-radius: 12px;
        padding: 15px;
        font-size: 13px;
        margin-bottom: 25px;
        text-align: left;
        border: 1px solid rgba(226, 139, 199, 0.3);
    }

    .action-btn {
        background: linear-gradient(135deg, #e28bc7 0%, #c45abd 100%);
        color: #fff;
        border: none;
        padding: 16px 32px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 10px 20px rgba(196, 90, 189, 0.3);
    }

    .back-link {
        margin-top: 30px;
        display: inline-block;
        color: rgba(255,255,255,0.5);
        text-decoration: none;
        font-size: 13px;
    }
</style>
</head>
<body>

<div class="content">
    <div class="header">
        <h1>HairLab</h1>
        <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">ИНДИВИДУАЛЬНЫЙ ПОДБОР</div>
    </div>

    <div class="quiz-card" id="quiz-container">
        <div id="question-screen">
            <div class="question-title" id="question-text">Загрузка...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div id="result-screen">
            <div style="font-size: 40px; margin-bottom: 10px;">✨</div>
            <div class="result-title" id="res-name">Процедура</div>
            <div class="result-desc" id="res-desc">Описание.</div>
            
            <div class="care-tip" id="res-tip">
                <strong>Важно об окрашивании:</strong><br>
                Планируйте окрашивание за 10-14 дней ДО или через 10-14 дней ПОСЛЕ визита.
            </div>

            <a href="index.html" class="action-btn">Посмотреть цены</a>
            <br>
            <a href="quiz.html" class="back-link">Начать заново</a>
        </div>
    </div>

    <center><a href="index.html" class="back-link">← На главную</a></center>
</div>

<script>
    const questions = [
        {
            text: "В каком состоянии ваши волосы?",
            options: [
                { text: "Натуральные / Здоровые", points: { nano: 3, ker: 1 } },
                { text: "Окрашены в темный / Сухие / Пушатся", points: { ker: 2, bixy: 3, bot: 1 } },
                { text: "Блонд / Сильно повреждены / Обламываются", points: { total: 5, bot: 2 } }
            ]
        },
        {
            text: "Какой результат вы хотите увидеть?",
            options: [
                { text: "Идеально прямые и зеркальный блеск", points: { ker: 4, nano: 4 } },
                { text: "Убрать пух, сохранить объем и напитать", points: { bot: 4, bixy: 2 } },
                { text: "Восстановить структуру и плотность", points: { total: 4, bot: 2 } }
            ]
        }
    ];

    let currentQ = 0;
    let scores = { ker: 0, bot: 0, nano: 0, bixy: 0, total: 0 };

    function renderQuestion() {
        const q = questions[currentQ];
        document.getElementById('question-text').innerText = q.text;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => handleAnswer(opt.points);
            container.appendChild(btn);
        });
    }

    function handleAnswer(points) {
        for (let key in points) scores[key] += points[key];
        currentQ++;
        if (currentQ < questions.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('question-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        
        const results = {
            ker: { 
                name: "Кератиновое выпрямление", 
                desc: "Для ваших волос это лучший способ добиться идеальной прямоты и блеска на срок до 9 месяцев. Справится даже с сильным завитком!",
                tip: "Окрашивание возможно за 10-14 дней до или после процедуры."
            },
            bot: { 
                name: "Ботокс для волос", 
                desc: "Вашим волосам не хватает питания. Ботокс уберет пушистость, сохранит прикорневой объем и сделает волосы мягкими на 3-5 месяцев.",
                tip: "Идеально подходит для поддержания здоровья волос между окрашиваниями."
            },
            nano: { 
                name: "Нанопластика Floractive", 
                desc: "ЭКО-выпрямление для ваших здоровых волос. Невероятный зеркальный блеск на срок до 12 месяцев без формальдегида!",
                tip: "Внимание: процедура не подходит для осветленных и поврежденных волос."
            },
            bixy: { 
                name: "Биксипластия (2 в 1)", 
                desc: "Оптимальный выбор для сухих и пористых волос. Она одновременно выпрямляет и глубоко увлажняет структуру волос.",
                tip: "Отлично работает на окрашенных волосах, возвращая им плотность."
            },
            total: { 
                name: "Тотальная реконструкция", 
                desc: "Вашим волосам нужна максимальная забота. Это двухэтапное восстановление, которое вернет прочность даже самым поврежденным прядям.",
                tip: "Обесцвечивание волос после данной процедуры возможно только через 2 месяца."
            }
        };

        document.getElementById('res-name').innerText = results[winner].name;
        document.getElementById('res-desc').innerText = results[winner].desc;
        document.getElementById('res-tip').innerHTML = `<strong>Важно:</strong><br>${results[winner].tip}`;
    }

    renderQuestion();
</script>

</body>
</html>
