<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HairLab — Квиз-диагностика</title>

<style>
    /* БАЗА (Фирменный синий стиль) */
    body {
        margin: 0;
        background: linear-gradient(180deg, #0d2bd7 0%, #143bdb 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .content {
        width: 100%;
        max-width: 500px;
        padding: 20px;
        box-sizing: border-box;
    }

    .header {
        text-align: center;
        margin: 20px 0 30px;
    }

    .header h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin: 0;
    }

    /* КАРТОЧКА КВИЗА (Glassmorphism) */
    .quiz-card {
        background: rgba(255,255,255,0.05);
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        padding: 25px;
        min-height: 350px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .question-title {
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 25px;
        line-height: 1.4;
        text-align: center;
    }

    .options-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .option-btn {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 16px;
        border-radius: 14px;
        color: #fff;
        text-align: left;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .option-btn:hover {
        background: rgba(255,255,255,0.15);
        transform: scale(1.02);
    }

    /* ЭКРАН РЕЗУЛЬТАТА */
    #result-screen { display: none; text-align: center; }
    
    .result-emoji { font-size: 48px; margin-bottom: 15px; }

    .result-title {
        font-size: 24px;
        color: #e28bc7;
        font-weight: 800;
        margin-bottom: 15px;
        text-transform: uppercase;
    }

    .result-desc {
        font-size: 15px;
        line-height: 1.6;
        opacity: 0.9;
        margin-bottom: 30px;
    }

    .action-btn {
        background: linear-gradient(135deg, #e28bc7 0%, #c45abd 100%);
        color: #fff;
        border: none;
        padding: 16px 32px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 10px 25px rgba(196, 90, 189, 0.4);
        transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.96); }

    .back-link {
        margin-top: 30px;
        display: inline-block;
        color: rgba(255,255,255,0.5);
        text-decoration: none;
        font-size: 13px;
        transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }
</style>
</head>
<body>

<div class="content">
    <div class="header">
        <h1>HairLab</h1>
        <div style="font-size: 12px; opacity: 0.7; margin-top: 8px; letter-spacing: 1px;">ДИАГНОСТИКА ВОЛОС</div>
    </div>

    <div class="quiz-card" id="quiz-container">
        <div id="question-screen">
            <div class="question-title" id="question-text">Загрузка...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div id="result-screen">
            <div class="result-emoji">✨</div>
            <div style="font-size: 12px; opacity: 0.7; margin-bottom: 5px;">ВАМ ИДЕАЛЬНО ПОДОЙДЕТ:</div>
            <div class="result-title" id="res-name">Процедура</div>
            <div class="result-desc" id="res-desc">Описание.</div>
            <a href="index.html" class="action-btn">Посмотреть цену</a>
            <br>
            <a href="quiz.html" class="back-link">Пройти тест заново</a>
        </div>
    </div>

    <center><a href="index.html" class="back-link">← Вернуться к прайсам</a></center>
</div>

<script>
    const questions = [
        {
            text: "Какое состояние ваших волос на данный момент?",
            options: [
                { text: "Натуральные, здоровые или окрашены в темный", points: { nano: 2, ker: 1, bixy: 1 } },
                { text: "Сухие, пушатся, трудно укладывать", points: { ker: 2, bixy: 2, bot: 1 } },
                { text: "Осветленные (блонд) или сильно поврежденные", points: { bot: 3, total: 3 } }
            ]
        },
        {
            text: "Какой эффект для вас в приоритете?",
            options: [
                { text: "Идеальная гладкость и выпрямление надолго", points: { nano: 3, ker: 3 } },
                { text: "Увлажнение, мягкость и легкое разглаживание", points: { bot: 2, bixy: 3 } },
                { text: "Максимальное восстановление и плотность", points: { total: 4, bot: 1 } }
            ]
        }
    ];

    let currentQ = 0;
    let scores = { ker: 0, bot: 0, nano: 0, bixy: 0, total: 0 };

    function renderQuestion() {
        const q = questions[currentQ];
        document.getElementById('question-text').innerText = q.text;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => handleAnswer(opt.points);
            container.appendChild(btn);
        });
    }

    function handleAnswer(points) {
        for (let key in points) scores[key] += points[key];
        currentQ++;
        if (currentQ < questions.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('question-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        
        const results = {
            ker: { 
                name: "Кератин", 
                desc: "Ваш запрос — безупречная прямота. Кератин дисциплинирует даже самый непослушный завиток, дарит зеркальный блеск и защищает от влажности." 
            },
            bot: { 
                name: "Ботокс", 
                desc: "Вашим волосам нужно интенсивное питание. Ботокс уплотнит структуру, уберет лишнюю пушистость и сделает волосы рассыпчатыми." 
            },
            nano: { 
                name: "Нанопластика", 
                desc: "Идеально для здоровых или натуральных волос. Максимальное выпрямление с сохранением природного блеска и силы." 
            },
            bixy: { 
                name: "Биксипластия", 
                desc: "Золотая середина! Она одновременно выпрямляет и глубоко увлажняет волосы, что особенно важно для сухих и окрашенных волос." 
            },
            total: { 
                name: "Реконструкция", 
                desc: "Вашим волосам нужна 'терапия'. Мы восстановим поврежденные связи внутри волоса, вернем им эластичность и подготовим к будущим преображениям." 
            }
        };

        document.getElementById('res-name').innerText = results[winner].name;
        document.getElementById('res-desc').innerText = results[winner].desc;
    }

    renderQuestion();
</script>

</body>
</html>
