<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HairLab — Подбор процедуры</title>
<link rel="stylesheet" href="brand.css">
<style>
  .quiz-wrap{ max-width: 560px; margin:0 auto; }
  .option{ width:100%; text-align:left; cursor:pointer; }
  .option:hover{ background: rgba(255,255,255,0.14); }
  .result-title{ font-size:18px; font-weight:900; letter-spacing:.02em; margin:0; }
  .spark{ font-size:38px; margin: 6px 0 8px; }
</style>
</head>

<body>
  <div class="wrap quiz-wrap">
    <div class="topbar">
      <div>
        <div class="brand">Hair Lab</div>
        <div class="sub">Индивидуальный подбор · 2 вопроса</div>
      </div>
      <div class="pills">
        <a class="pill" href="hub.html">Хаб →</a>
        <a class="pill" href="index.html">Прайсы →</a>
      </div>
    </div>

    <div class="card" id="quiz-container">
      <div id="question-screen">
        <div class="h" id="question-text">Загрузка...</div>
        <div style="margin-top:12px; display:flex; flex-direction:column; gap:10px;" id="options-container"></div>
        <div class="small" style="margin-top:12px;">Подбор носит рекомендательный характер — мастер уточнит детали на консультации.</div>
      </div>

      <div id="result-screen" style="display:none;">
        <div class="spark">✨</div>
        <h2 class="result-title" id="res-name">Процедура</h2>
        <div class="p" id="res-desc" style="margin-top:10px;">Описание.</div>

        <div class="card" style="margin-top:14px; border-color: rgba(226,139,199,0.32); background: rgba(226,139,199,0.10);">
          <div class="h" style="font-size:13px;">Важно</div>
          <div class="small" id="res-tip" style="margin-top:8px;">Подсказка.</div>
        </div>

        <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
