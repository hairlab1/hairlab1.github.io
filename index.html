<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Lab — Клиентское меню</title>

<style>
/* ===== RESET ===== */
* {
  box-sizing: border-box;
}

/* ===== BODY & BACKGROUND ===== */
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color: #ffffff;

  background:
    linear-gradient(
      rgba(0,0,0,0.35),
      rgba(0,0,0,0.35)
    ),
    url("fonhlsite.png") center / cover no-repeat fixed;
}

/* ===== MAIN CONTAINER ===== */
.content {
  max-width: 920px;
  margin: 0 auto;
  padding-bottom: 120px;
}

/* ===== HEADER ===== */
.address-bar {
  padding: 20px 18px 10px;
}

.address-brand {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.address-sub {
  font-size: 11px;
  opacity: 0.85;
  margin-top: 2px;
}

.address-line {
  font-size: 12px;
  opacity: 0.85;
  margin-top: 2px;
}

/* ===== CLIENT HUB BUTTONS ===== */
.hub {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin: 24px 16px 40px;
}

.hub a {
  text-decoration: none;
}

.hub-btn {
  width: 100%;
  padding: 20px 18px;

  text-align: center;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;

  color: #ffffff;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 18px;

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s ease;
}

.hub-btn:active {
  transform: scale(0.97);
  background: rgba(0,0,0,0.45);
}

.hub-note {
  margin-top: 8px;
  text-align: center;
  font-size: 11px;
  opacity: 0.7;
}

/* ===== FOOTER ===== */
.footer-note {
  margin: 60px 18px 20px;
  text-align: center;
  font-size: 11px;
  opacity: 0.65;
}
</style>
</head>

<body>

<div class="content">

  <!-- HEADER -->
  <div class="address-bar">
    <div class="address-brand">Hair Lab</div>
    <div class="address-sub">Первая студия по реконструкции волос</div>
    <div class="address-line">Томск — Розы Люксембург, 4В</div>
  </div>

  <!-- CLIENT MENU -->
  <section class="hub">

    <a href="gift.html">
      <div class="hub-btn">Получи подарок</div>
    </a>

    <a href="cashback.html">
      <div class="hub-btn">Твой кешбэк</div>
    </a>

    <a href="price.html">
      <div class="hub-btn">Прайс со скидкой</div>
    </a>

    <a href="https://t.me/hairlab_tomsk" target="_blank">
      <div class="hub-btn">Онлайн-запись</div>
    </a>

    <a href="snacks.html">
      <div class="hub-btn">Чем заняться во время процедуры</div>
    </a>

    <a href="treat.html">
      <div class="hub-btn">Побалуй себя</div>
    </a>

    <div class="hub-note">
      Клиентское меню Hair Lab
    </div>

  </section>

  <div class="footer-note">
    Hair Lab · Красивые волосы без компромиссов
  </div>

</div>

</body>
</html>
