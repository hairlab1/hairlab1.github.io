<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HairLab — Прайсы</title>

<style>
body{
margin:0;
background:linear-gradient(180deg,#0d2bd7 0%,#143bdb 100%);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
color:#fff;
-webkit-font-smoothing:antialiased;
}

.content{
max-width:920px;
margin:0 auto;
padding-bottom:120px;
}

/* NAV */

.nav{
position:sticky;
top:8px;
z-index:1000;
margin:12px auto;
padding:6px 10px;
display:flex;
gap:6px;
background:rgba(5,12,60,0.45);
border-radius:22px;
backdrop-filter:blur(14px);
width:fit-content;
}

.nav button{
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
color:#fff;
padding:8px 14px;
border-radius:999px;
font-size:13px;
font-weight:600;
cursor:pointer;
}

.nav button.active{
background:rgba(255,255,255,0.3);
}

/* HEADER */

.address-bar{
margin:18px;
}

.address-brand{
font-size:18px;
font-weight:700;
letter-spacing:.08em;
text-transform:uppercase;
}

.address-sub{
font-size:11px;
opacity:.8;
}

.address-line{
font-size:12px;
opacity:.85;
}

/* SECTIONS */

.section-header{
display:flex;
align-items:center;
gap:10px;
margin:32px 18px 8px;
}

.section-marker{
width:6px;
height:22px;
border-radius:999px;
background:rgba(255,255,255,0.85);
}

.section-header h2{
font-size:18px;
margin:0;
text-transform:uppercase;
}

/* INTRO */

.intro{
width:94%;
margin:20px auto 30px;
border-radius:22px;
overflow:hidden;
cursor:pointer;
}

.intro img{
width:100%;
display:block;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
padding:0 16px;
}

.card{
border-radius:16px;
overflow:hidden;
cursor:pointer;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
}

.card img{
width:100%;
display:block;
}

/* MODAL */

.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.92);
display:none;
align-items:center;
justify-content:center;
z-index:3000;
}

.modal-overlay.open{
display:flex;
}

.modal-inner{
position:relative;
max-width:96%;
max-height:90vh;
}

.modal-inner img{
max-width:100%;
max-height:80vh;
border-radius:18px;
display:block;
}

/* CONTROLS */

.modal-close{
position:absolute;
top:-14px;
right:-14px;
width:36px;
height:36px;
background:rgba(255,255,255,0.25);
border-radius:50%;
font-size:26px;
text-align:center;
line-height:34px;
cursor:pointer;
}

.modal-nav{
position:absolute;
top:50%;
transform:translateY(-50%);
width:44px;
height:44px;
background:rgba(255,255,255,0.25);
border-radius:50%;
font-size:30px;
line-height:42px;
text-align:center;
cursor:pointer;
user-select:none;
}

.modal-prev{left:8px;}
.modal-next{right:8px;}

.footer-note{
margin:40px 18px;
text-align:center;
font-size:11px;
opacity:.65;
}

/* CONTACT BUTTON */

.contact-menu{
position:fixed;
bottom:26px;
right:20px;
z-index:5000;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:12px;
}

.contact-main{
background:rgba(255,255,255,0.9);
color:#0d2bd7;
border:none;
border-radius:999px;
padding:14px 22px;
font-weight:700;
font-size:14px;
cursor:pointer;
backdrop-filter:blur(20px);
box-shadow:0 12px 30px rgba(0,0,0,0.25);
transition:all .25s ease;
}

.contact-main:hover{
transform:translateY(-2px) scale(1.03);
}

.contact-items{
display:flex;
flex-direction:column;
gap:10px;
opacity:0;
transform:translateY(10px);
pointer-events:none;
transition:all .25s ease;
}

.contact-items.open{
opacity:1;
transform:translateY(0);
pointer-events:auto;
}

.contact-items a{
display:flex;
align-items:center;
gap:10px;
background:rgba(255,255,255,0.95);
color:#0d2bd7;
text-decoration:none;
padding:10px 16px;
border-radius:999px;
font-size:13px;
font-weight:600;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.contact-items img{
width:16px;
height:16px;
}

</style>
</head>

<body>

<!-- MODAL -->

<div id="imageModal" class="modal-overlay">
<div class="modal-inner">
<div class="modal-close">×</div>
<div class="modal-nav modal-prev">‹</div>
<div class="modal-nav modal-next">›</div>
<img id="modalImage">
</div>
</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const navButtons=[...document.querySelectorAll(".nav button")]

function scrollToId(id){
const el=document.getElementById(id)
const y=el.getBoundingClientRect().top+window.pageYOffset-70
window.scrollTo({top:y,behavior:"smooth"})
navButtons.forEach(b=>b.classList.toggle("active",b.dataset.target===id))
}

navButtons.forEach(btn=>{
btn.addEventListener("click",()=>scrollToId(btn.dataset.target))
})

const modal=document.getElementById("imageModal")
const modalImg=document.getElementById("modalImage")
const images=[...document.querySelectorAll(".intro img,.card img")]

let index=0

function show(i){
if(i<0)i=images.length-1
if(i>=images.length)i=0
index=i
modalImg.src=images[index].src
}

images.forEach((img,i)=>{
img.addEventListener("click",()=>{
show(i)
modal.classList.add("open")
})
})

modal.onclick=()=>{
modal.classList.remove("open")
}

document.querySelector(".modal-prev").onclick=e=>{
e.stopPropagation()
show(index-1)
}

document.querySelector(".modal-next").onclick=e=>{
e.stopPropagation()
show(index+1)
}

/* CONTACT MENU */

const contactToggle=document.getElementById("contactToggle")
const contactItems=document.getElementById("contactItems")

contactToggle.addEventListener("click",e=>{
e.stopPropagation()
contactItems.classList.toggle("open")
})

document.addEventListener("click",e=>{
if(!contactItems.contains(e.target)&&e.target!==contactToggle){
contactItems.classList.remove("open")
}
})

})

</script>

</html>
