<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HairLab — Прайсы</title>

<style>
    /* БАЗА */
    body {
        margin: 0;
        background: linear-gradient(180deg, #0d2bd7 0%, #143bdb 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #ffffff;
        scroll-behavior: smooth;
    }

    /* УБИРАЕМ СТАНДАРТНЫЙ ФОКУС */
    *:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.7);
        outline-offset: 3px;
    }
    *:focus:not(:focus-visible) { outline: none; }

    .content {
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        padding-bottom: 90px;
    }

    /* ===== GLASS НАВИГАЦИЯ ===== */
    .nav {
        position: sticky;
        top: max(6px, env(safe-area-inset-top)); 
        z-index: 999;
        margin: 0 auto;
        padding: 6px 10px;
        display: flex;
        overflow-x: auto; 
        justify-content: flex-start;
        background: rgba(5, 12, 60, 0.45);
        border-radius: 22px;
        width: fit-content;
        max-width: 98%; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.22);
        backdrop-filter: blur(14px) saturate(150%);
        -webkit-backdrop-filter: blur(14px) saturate(150%);
        border: 1px solid rgba(255,255,255,0.18);
        transition: box-shadow 0.15s ease;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav { -ms-overflow-style: none; scrollbar-width: none; }

    .nav button {
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.20);
        padding: 8px 12px;
        border-radius: 999px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
        white-space: nowrap;
        margin-right: 4px;
    }
    .nav button.active { background: rgba(255,255,255,0.26); border-color: rgba(255,255,255,0.45); }

    .address-bar { margin: 18px 18px 10px; display: flex; flex-direction: column; gap: 2px; color: rgba(255,255,255,0.95); }
    .address-brand { font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
    .address-sub { font-size: 11px; opacity: 0.8; }
    .address-line { font-size: 12px; opacity: 0.85; }

    /* КАТЕГОРИИ */
    .section-header { display: flex; align-items: center; gap: 10px; margin: 32px 18px 4px; }
    .section-marker { width: 6px; height: 22px; border-radius: 999px; background: rgba(255,255,255,0.85); box-shadow: 0 0 12px rgba(255,255,255,0.7); }
    .section-header h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .section-header::after { content: ""; flex: 1; height: 1px; margin-left: 12px; background: rgba(255,255,255,0.30); }

    .intro { width: 94%; margin: 20px auto 30px; border-radius: 22px; overflow: hidden; box-shadow: 0 14px 26px rgba(0,0,0,0.28); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); cursor: pointer; }
    .intro img { width: 100%; display: block; }

    /* ОПТИМИЗАЦИЯ СЕТКИ (убрали тяжелый блюр) */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 16px; }
    .card { background: rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: transform 0.14s ease; }
    .card:hover { transform: translateY(-2px); }
    .card img { width: 100%; display: block; }

    /* ===== МЕНЮ ЗАПИСАТЬСЯ ===== */
    .fab-wrapper {
        position: fixed;
        right: 16px;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
    }
    .fab-menu { display: none; flex-direction: column; gap: 8px; margin-bottom: 6px; }
    .fab-menu.open { display: flex; }

    .fab-option {
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        min-width: 170px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.05); 
        border: 1px solid rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }
    
    .fab-main {
        background: linear-gradient(135deg, #e28bc7 0%, #c45abd 100%);
        color: #fff; border-radius: 999px; padding: 12px 28px;
        font-size: 16px; font-weight: 700; cursor: pointer; border: none;
        box-shadow: 0 10px 25px rgba(196, 90, 189, 0.4);
    }

    /* МОДАЛКА */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-inner { position: relative; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .modal-inner img { max-width: 100%; max-height: 80vh; border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); cursor: pointer; }
    
    .modal-close { position: absolute; top: 4px; right: 4px; width: 34px; height: 34px; background: rgba(255,255,255,0.2); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.4); z-index: 2001; }
    .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; background: rgba(255,255,255,0.15); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); z-index: 2001; font-size: 24px; }
    .modal-prev { left: 4px; } .modal-next { right: 4px; }
    .modal-hint { text-align: center; font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 10px; }

    .footer-note { margin: 32px 18px 10px; text-align: center; font-size: 11px; color: rgba(255,255,255,0.65); }
</style>
</head>
<body>

<div class="content">
    <div class="nav">
        <button data-target="viypr">Выпрямление</button>
        <button data-target="uhod">Уходы</button>
        <button data-target="okrash">Окрашивание</button>
        <button onclick="window.location.href='quiz.html'" style="background: rgba(226, 139, 199, 0.3); border-color: #e28bc7;">Подбор 🪄</button>
    </div>

    <div class="address-bar">
        <h1 class="address-brand">Hair Lab</h1>
        <div class="address-sub">Первая студия по реконструкции волос</div>
        <div class="address-line">Томск — Розы Люксембург, 4В — 4 этаж</div>
    </div>

    <main>
        <div class="intro" tabindex="0"><img src="19 Презентация.jpg" alt="HairLab"></div>

        <div id="viypr" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Выпрямление / Разглаживание</h2></div>
            <div class="grid">
                <div class="card" tabindex="0"><img src="2 Ботокс.jpg" alt="Ботокс"></div>
                <div class="card" tabindex="0"><img src="3 Биксипластия.jpg" alt="Биксипластия"></div>
                <div class="card" tabindex="0"><img src="4 Коллаген.jpg" alt="Коллаген"></div>
                <div class="card" tabindex="0"><img src="5 Кератин.jpg" alt="Кератин"></div>
                <div class="card" tabindex="0"><img src="6 Тотальная описание.jpg" alt="Тотальная описание"></div>
                <div class="card" tabindex="0"><img src="7 Тотальная стоимость.jpg" alt="Тотальная стоимость"></div>
                <div class="card" tabindex="0"><img src="13 Височная зона.jpg" alt="Височная зона"></div>
                <div class="card" tabindex="0"><img src="8 Нанопластика.jpg" alt="Нанопластика"></div>
                <div class="card" tabindex="0"><img src="17 Бразилиан.jpg" alt="Бразилиан"></div>
            </div>
        </div>

        <div id="uhod" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Уходы + Стрижки</h2></div>
            <div class="grid">
                <div class="card" tabindex="0"><img src="9 Холодное.jpg" alt="Холодное"></div>
                <div class="card" tabindex="0"><img src="10 Счастье.jpg" alt="Счастье"></div>
                <div class="card" tabindex="0"><img src="16 Адорн.jpg" alt="Адорн"></div>
                <div class="card" tabindex="0"><img src="11 Пилинг диагностика.jpg" alt="Пилинг"></div>
                <div class="card" tabindex="0"><img src="12 Полировка.jpg" alt="Полировка"></div>
                <div class="card" tabindex="0"><img src="14 Стрижка.jpg" alt="Стрижка"></div>
            </div>
        </div>

        <div id="okrash" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Окрашивание</h2></div>
            <div class="grid">
                <div class="card" tabindex="0"><img src="15 Тонирование.jpg" alt="Тонирование"></div>
                <div class="card" tabindex="0"><img src="18 Биозавивка.jpg" alt="Биозавивка"></div>
            </div>
        </div>

        <div class="footer-note">HairLab · Томск · Красивые волосы без компромиссов</div>
    </main>
</div>

<div id="fabWrapper" class="fab-wrapper">
    <div id="fabMenu" class="fab-menu">
        <button class="fab-option" onclick="openPhone()">📞 Позвонить</button>
        <button class="fab-option" onclick="openTelegram()">✈️ Telegram</button>
        <button class="fab-option" onclick="openMax()">💬 Max Messenger</button>
        <button class="fab-option" onclick="openWhatsApp()">🟢 WhatsApp</button>
        <button class="fab-option" onclick="openInstagram()">📸 Instagram</button>
    </div>
    <button id="fabMain" class="fab-main"><span>Записаться</span></button>
</div>

<div id="imageModal" class="modal-overlay">
    <div class="modal-inner">
        <button class="modal-close">×</button>
        <button class="modal-nav modal-prev">‹</button>
        <button class="modal-nav modal-next">›</button>
        <img id="modalImage" src="" alt="">
        <div class="modal-hint">Нажмите в любое место, чтобы закрыть</div>
    </div>
</div>

<script>
    const PHONE = "79528883050";

    function openWhatsApp() { window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent("Здравствуйте! Хочу записаться в HairLab.")}`, "_blank"); }
    function openTelegram() { window.open("https://t.me/hairlab_tomsk", "_blank"); }
    function openInstagram() { window.open("https://instagram.com/hairlab_", "_blank"); }
    function openPhone() { window.location.href = `tel:+${PHONE}`; }
    function openMax() { window.open("https://max.ru/u/f9LHodD0cOIlRLZOAOZa-YWwHrQ7eNQtVgbGT8yuzBOVtGVbokoiV5S59JQ", "_blank"); }

    document.addEventListener("DOMContentLoaded", () => {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        const fabWrapper = document.getElementById("fabWrapper");
        const thumbs = Array.from(document.querySelectorAll(".card img, .intro img"));
        let curIdx = 0;

        const showImg = (i) => {
            if (i < 0) i = thumbs.length - 1;
            if (i >= thumbs.length) i = 0;
            curIdx = i;
            modalImg.src = thumbs[curIdx].src;
        };

        document.querySelectorAll(".card, .intro").forEach((el, i) => {
            el.onclick = () => { showImg(i); modal.classList.add("open"); document.body.style.overflow="hidden"; fabWrapper.style.display="none"; };
        });

        modal.onclick = () => { modal.classList.remove("open"); document.body.style.overflow=""; fabWrapper.style.display="flex"; };
        document.querySelector(".modal-prev").onclick = (e) => { e.stopPropagation(); showImg(curIdx - 1); };
        document.querySelector(".modal-next").onclick = (e) => { e.stopPropagation(); showImg(curIdx + 1); };
        document.querySelector(".modal-close").onclick = (e) => { e.stopPropagation(); modal.onclick(); };

        const fabMain = document.getElementById("fabMain");
        const fabMenu = document.getElementById("fabMenu");
        fabMain.onclick = (e) => { e.stopPropagation(); fabMenu.classList.toggle("open"); };
        document.onclick = () => fabMenu.classList.remove("open");

        const navBtns = document.querySelectorAll(".nav button");
        navBtns.forEach(b => {
            b.onclick = () => {
                if(b.dataset.target) {
                    document.getElementById(b.dataset.target).scrollIntoView({ behavior: 'smooth' });
                }
            };
        });

        const obs = new IntersectionObserver(ents => {
            ents.forEach(en => { if(en.isIntersecting) navBtns.forEach(b => b.classList.toggle("active", b.dataset.target === en.target.id)); });
        }, { rootMargin: '-10% 0px -60% 0px', threshold: 0.1 });
        document.querySelectorAll(".section").forEach(s => obs.observe(s));
    });
</script>
</body>
</html>
