<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HairLab — Прайсы</title>

<style>
    /* БАЗА */
    body {
        margin: 0;
        background: linear-gradient(180deg, #2f53ff 0%, #5d7dff 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #ffffff;
        scroll-behavior: smooth;
    }

    .content {
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        padding-bottom: 90px;
    }

    /* ===== GLASS НАВИГАЦИЯ (компактная) ===== */
    .nav {
        position: sticky;
        top: 0;
        z-index: 999;

        margin: 6px auto 0;
        padding: 6px 10px;

        display: flex;
        justify-content: center;
        gap: 6px;

        background: rgba(5, 12, 60, 0.45);
        border-radius: 22px;
        width: fit-content;

        box-shadow: 0 10px 18px rgba(0,0,0,0.22);
        backdrop-filter: blur(14px) saturate(150%);
        -webkit-backdrop-filter: blur(14px) saturate(150%);
        border: 1px solid rgba(255,255,255,0.18);
    }

    .nav button {
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.20);
        padding: 8px 12px;
        border-radius: 999px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.3px;
        transition: background 0.15s ease, transform 0.12s ease, border-color 0.12s ease;
        white-space: nowrap;
    }

    .nav button:hover {
        background: rgba(255,255,255,0.18);
        border-color: rgba(255,255,255,0.32);
    }

    .nav button:active {
        transform: scale(0.96);
    }

    /* ЗАГОЛОВКИ БЛОКОВ */
    h2 {
        font-size: 20px;
        margin: 32px 18px 14px;
        padding-bottom: 10px;
        font-weight: 700;
        letter-spacing: 0.3px;
        position: relative;
    }

    h2::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 100%;
        background: rgba(255,255,255,0.4);
    }

    /* Блок "Преимущества" */
    .intro {
        width: 94%;
        margin: 18px auto 30px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 14px 26px rgba(0,0,0,0.28);
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.22);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        cursor: pointer;
        transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .intro:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(0,0,0,0.30);
    }

    .intro img {
        width: 100%;
        display: block;
    }

    /* СЕТКА КАРТОЧЕК */
    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        padding: 0 16px;
    }

    /* КАРТОЧКИ ПРАЙСОВ */
    .card {
        background: rgba(255,255,255,0.08);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 22px rgba(0,0,0,0.28);
        border: 1px solid rgba(255,255,255,0.22);
        backdrop-filter: blur(16px) saturate(150%);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        cursor: pointer;
        transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }

    .card img {
        width: 100%;
        display: block;
    }

    .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(0,0,0,0.32);
        border-color: rgba(210,225,255,0.9);
    }

    /* ПЛАВАЮЩЕЕ МЕНЮ "ЗАПИСАТЬСЯ" */
    .fab-wrapper {
        position: fixed;
        right: 16px;
        bottom: 18px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
    }

    .fab-menu {
        display: none;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 4px;
    }

    .fab-menu.open {
        display: flex;
    }

    .fab-option {
        border: none;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        cursor: pointer;
        min-width: 140px;
        box-shadow: 0 8px 18px rgba(0,0,0,0.35);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    }

    .fab-option:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.38);
    }

    .whatsapp { background: #25D366; }
    .telegram { background: #229ED9; }
    .instagram {
        background: radial-gradient(circle at 30% 30%,
            #fdf497 0, #fdf497 8%, #fd5949 45%, #d6249f 60%, #285AEB 100%);
    }

    .fab-option-icon {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .fab-option-icon svg {
        width: 100%;
        height: 100%;
    }

    /* РОЗОВАЯ КНОПКА "ЗАПИСАТЬСЯ" */
    .fab-main {
        background: linear-gradient(135deg, #e28bc7 0%, #d36bc2 50%, #c45abd 100%);
        color: #ffffff;

        border-radius: 999px;
        padding: 12px 20px;

        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3px;

        cursor: pointer;
        border: none;

        display: flex;
        gap: 8px;
        align-items: center;

        transition: transform 0.12s ease, filter 0.15s ease;
    }

    .fab-main:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
    }

    .fab-main:active {
        transform: scale(0.96);
    }

    .fab-icon {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        position: relative;
    }

    .fab-icon::after {
        content: "";
        position: absolute;
        width: 6px;
        height: 6px;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        transform: rotate(40deg);
        left: 3px;
        top: 1px;
    }

    /* МОДАЛЬНАЯ КАРТИНКА */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 16px;
    }

    .modal-overlay.open {
        display: flex;
    }

    .modal-overlay img {
        max-width: 100%;
        max-height: 90vh;
        border-radius: 18px;
        box-shadow:
            0 20px 40px rgba(0,0,0,0.7),
            0 0 24px rgba(200,220,255,0.9);
    }
</style>
</head>
<body>

<div class="content">

    <!-- НАВИГАЦИЯ -->
    <div class="nav">
        <button onclick="scrollToId('viypr')">Выпрямление</button>
        <button onclick="scrollToId('uhod')">Уходы</button>
        <button onclick="scrollToId('okrash')">Окрашивание</button>
    </div>

    <!-- ПРЕИМУЩЕСТВА -->
    <div class="intro zoomable">
        <img src="Преимущества.jpeg" alt="Преимущества HairLab">
    </div>

    <!-- ВЫПРЯМЛЕНИЕ -->
    <div id="viypr" class="section">
        <h2>ПРОЦЕДУРЫ ДЛЯ ВЫПРЯМЛЕНИЯ / РАЗГЛАЖИВАНИЯ ВОЛОС</h2>

        <div class="grid">
    <div class="card"><img src="Ботокс.jpg" alt=""></div>
    <div class="card"><img src="Биксипластия 2в1.jpg" alt=""></div>
    <div class="card"><img src="Кератин коллаген.jpg" alt=""></div>
    <div class="card"><img src="Кератин.jpg" alt=""></div>
    <div class="card"><img src="totalnaya.jpg" alt=""></div>
    <div class="card"><img src="totalnaya1.jpg" alt=""></div><!-- 🔥 ДОБАВЛЕН -->
    <div class="card"><img src="Виски.JPG" alt=""></div>
    <div class="card"><img src="Нанопластика.jpeg" alt=""></div>
    <div class="card"><img src="Бразилиан.jpeg" alt=""></div>
</div>
    </div>

    <!-- УХОДЫ -->
    <div id="uhod" class="section">
        <h2>УХОДЫ + СТРИЖКИ</h2>

        <div class="grid">
            <div class="card"><img src="Холодное восстановление.jpeg" alt=""></div>
            <div class="card"><img src="Счастье для волос.jpeg" alt=""></div>
            <div class="card"><img src="Адорн.jpeg" alt=""></div>
            <div class="card"><img src="Диагностика+пилинг.jpg" alt=""></div>
            <div class="card"><img src="Авторская стрижка(полировка).jpg" alt=""></div>
            <div class="card"><img src="Стрижка.jpeg" alt=""></div>
        </div>
    </div>

    <!-- ОКРАШИВАНИЕ -->
    <div id="okrash" class="section">
        <h2>ОКРАШИВАНИЕ И БИОЗАВИВКА</h2>

        <div class="grid">
            <div class="card"><img src="Окрашивание.JPG" alt=""></div>
            <div class="card"><img src="Биозавивка.jpg" alt=""></div>
        </div>
    </div>

</div>

<!-- МЕНЮ "ЗАПИСАТЬСЯ" -->
<div id="fabWrapper" class="fab-wrapper">
    <div id="fabMenu" class="fab-menu">
        <button class="fab-option whatsapp" onclick="openWhatsApp()">
            <span class="fab-option-icon">
                <!-- WhatsApp SVG -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#ffffff" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.966-.273-.099-.472-.148-.672.15-.198.297-.77.966-.944 1.164-.173.198-.347.223-.644.074-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.173.198-.297.298-.496.099-.198.05-.372-.025-.521-.075-.149-.672-1.611-.92-2.206-.242-.579-.487-.5-.672-.51l-.573-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 3.766h-.004a4.9 4.9 0 01-2.403-.654l-.172-.102-1.785.467.476-1.74-.112-.178a4.9 4.9 0 01-.754-2.6c.001-2.717 2.212-4.928 4.932-4.928 1.318 0 2.555.513 3.484 1.443a4.92 4.92 0 011.445 3.5c-.002 2.717-2.213 4.928-4.932 4.928m4.161-9.089A6.86 6.86 0 0012.05 6a6.86 6.86 0 00-6.866 6.857 6.82 6.82 0 001.028 3.57L5 20.5l4.164-1.09a6.9 6.9 0 002.887.665h.003c3.785 0 6.868-3.079 6.87-6.866a6.82 6.82 0 00-2.012-4.84"/>
                </svg>
            </span>
            <span>WhatsApp</span>
        </button>

        <button class="fab-option telegram" onclick="openTelegram()">
            <span class="fab-option-icon">
                <!-- Telegram SVG -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#ffffff" d="M9.999 15.2l-.39 3.45c.558 0 .801-.24 1.09-.527l2.615-2.497 5.42 3.96c.994.547 1.702.26 1.963-.918l3.56-16.7h.001c.316-1.47-.53-2.046-1.503-1.686L1.352 9.53c-1.438.559-1.417 1.36-.244 1.72l4.77 1.488 11.08-6.98c.522-.317.997-.147.606.17"/>
                </svg>
            </span>
            <span>Telegram</span>
        </button>

        <button class="fab-option instagram" onclick="openInstagram()">
            <span class="fab-option-icon">
                <!-- Instagram SVG -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="none" stroke="#ffffff" stroke-width="1.6" d="M8 3.5h8a4.5 4.5 0 0 1 4.5 4.5v8a4.5 4.5 0 0 1-4.5 4.5H8A4.5 4.5 0 0 1 3.5 16v-8A4.5 4.5 0 0 1 8 3.5z"/>
                    <circle cx="12" cy="12" r="3.2" fill="none" stroke="#ffffff" stroke-width="1.6"/>
                    <circle cx="17" cy="7" r="1" fill="#ffffff"/>
                </svg>
            </span>
            <span>Instagram</span>
        </button>
    </div>

    <button id="fabMain" class="fab-main">
        <div class="fab-icon"></div>
        <span>Записаться</span>
    </button>
</div>

<!-- МОДАЛЬНОЕ УВЕЛИЧЕНИЕ КАРТОК -->
<div id="imageModal" class="modal-overlay">
    <img id="modalImage" src="" alt="">
</div>

<script>
    function scrollToId(id) {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    function openWhatsApp() {
        const phone = "79528883050";
        const text = encodeURIComponent("Здравствуйте! Хочу записаться в HairLab.");
        window.open("https://wa.me/" + phone + "?text=" + text, "_blank");
    }

    function openTelegram() {
        window.open("https://t.me/hairlab_tomsk", "_blank");
    }

    function openInstagram() {
        window.open("https://instagram.com/hairlab_", "_blank");
    }

    document.addEventListener("DOMContentLoaded", function () {
        const modal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");

        // Увеличение картинок
        document.querySelectorAll(".card img, .intro img").forEach(img => {
            img.addEventListener("click", function () {
                modalImage.src = this.src;
                modal.classList.add("open");
                document.body.style.overflow = "hidden";
            });
        });

        modal.addEventListener("click", function () {
            modal.classList.remove("open");
            document.body.style.overflow = "";
        });

        // Кнопка "Записаться" и меню
        const fabWrapper = document.getElementById("fabWrapper");
        const fabMain = document.getElementById("fabMain");
        const fabMenu = document.getElementById("fabMenu");

        fabMain.addEventListener("click", function (e) {
            e.stopPropagation();
            fabMenu.classList.toggle("open");
        });

        document.addEventListener("click", function (e) {
            if (!fabWrapper.contains(e.target)) {
                fabMenu.classList.remove("open");
            }
        });
    });
</script>

</body>
</html>
