<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HairLab — Прайсы</title>

<style>
    /* === БАЗОВЫЕ СТИЛИ === */
    body {
        margin: 0;
        background: linear-gradient(180deg, #0d2bd7 0%, #143bdb 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #ffffff;
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
    }

    .content {
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        padding-bottom: 90px;
    }

    /* === GLASS НАВИГАЦИЯ === */
    .nav {
        position: sticky;
        top: max(6px, env(safe-area-inset-top)); 
        z-index: 999;
        margin: 0 auto;
        padding: 6px 10px;
        display: flex;
        overflow-x: auto; 
        background: rgba(5, 12, 60, 0.45);
        border-radius: 22px;
        width: fit-content;
        max-width: 98%; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.22);
        backdrop-filter: blur(14px) saturate(150%);
        -webkit-backdrop-filter: blur(14px) saturate(150%);
        border: 1px solid rgba(255,255,255,0.18);
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav button {
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.20);
        padding: 8px 12px;
        border-radius: 999px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
        white-space: nowrap;
        margin-right: 6px;
    }
    .nav button.active { background: rgba(255,255,255,0.26); border-color: rgba(255,255,255,0.45); }

    /* === ШАПКА === */
    .address-bar { margin: 18px 18px 10px; display: flex; flex-direction: column; gap: 2px; }
    .address-brand { font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
    .address-sub { font-size: 11px; opacity: 0.8; }
    .address-line { font-size: 12px; opacity: 0.85; }

    /* === КАРТОЧКИ === */
    .section-header { display: flex; align-items: center; gap: 10px; margin: 32px 18px 4px; }
    .section-marker { width: 6px; height: 22px; border-radius: 999px; background: rgba(255,255,255,0.85); box-shadow: 0 0 12px rgba(255,255,255,0.7); }
    .section-header h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .section-header::after { content: ""; flex: 1; height: 1px; margin-left: 12px; background: rgba(255,255,255,0.30); }

    .intro { width: 94%; margin: 20px auto 30px; border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,255,255,0.22); cursor: pointer; box-shadow: 0 12px 30px rgba(0,0,0,0.3); background: rgba(255,255,255,0.05); }
    .intro img { width: 100%; display: block; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 16px; }
    .card { background: rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: transform 0.1s; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    .card:active { transform: scale(0.97); }
    .card img { width: 100%; display: block; }

    /* === МЕНЮ ЗАПИСАТЬСЯ (ИКОНКИ) === */
    .fab-wrapper { position: fixed; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .fab-menu { display: none; flex-direction: column; gap: 8px; margin-bottom: 6px; }
    .fab-menu.open { display: flex; }
    
    .fab-option {
        border: none; border-radius: 999px; padding: 12px 20px; font-size: 14px; font-weight: 600; color: #fff;
        cursor: pointer; min-width: 180px; display: flex; align-items: center; gap: 12px;
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px); box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }
    .fab-option img, .fab-option svg { width: 22px; height: 22px; flex-shrink: 0; object-fit: contain; }
    
    .fab-main {
        background: linear-gradient(135deg, #e28bc7 0%, #c45abd 100%); color: #fff; border-radius: 999px;
        padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer; border: none;
        box-shadow: 0 10px 25px rgba(196, 90, 189, 0.4);
    }

    /* === МОДАЛКА === */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-inner { position: relative; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; align-items: center; }
    .modal-inner img { max-width: 100%; max-height: 80vh; border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); cursor: pointer; }
    
    .modal-close { position: absolute; top: 4px; right: 4px; width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.4); z-index: 2001; font-size: 26px; }
    .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; background: rgba(255,255,255,0.15); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); z-index: 2001; font-size: 30px; }
    .modal-prev { left: 8px; } .modal-next { right: 8px; }
    .modal-hint { text-align: center; font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 10px; }

    .footer-note { margin: 40px 18px 20px; text-align: center; font-size: 11px; color: rgba(255,255,255,0.65); }
</style>
</head>
<body>

<div class="content">
    <div class="nav">
        <button data-target="viypr">Выпрямление</button>
        <button data-target="uhods">Уходы</button>
        <button data-target="okrash">Окрашивание</button>
    </div>

    <div class="address-bar">
        <h1 class="address-brand">Hair Lab</h1>
        <div class="address-sub">Первая студия по реконструкции волос</div>
        <div class="address-line">Томск — Розы Люксембург, 4В — 4 этаж</div>
    </div>

    <main>
        <div class="intro"><img src="19 Презентация.jpg" alt="О студии"></div>

        <div id="viypr" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Выпрямление / Разглаживание</h2></div>
            <div class="grid">
                <div class="card"><img src="2 Ботокс.jpg"></div>
                <div class="card"><img src="3 Биксипластия.jpg"></div>
                <div class="card"><img src="4 Коллаген.jpg"></div>
                <div class="card"><img src="5 Кератин.jpg"></div>
                <div class="card"><img src="6 Тотальная описание.jpg"></div>
                <div class="card"><img src="7 Тотальная стоимость.jpg"></div>
                <div class="card"><img src="13 Височная зона.jpg"></div>
                <div class="card"><img src="8 Нанопластика.jpg"></div>
                <div class="card"><img src="17 Бразилиан.jpg"></div>
            </div>
        </div>

        <div id="uhods" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Уходы + Стрижки</h2></div>
            <div class="grid">
                <div class="card"><img src="9 Холодное.jpg"></div>
                <div class="card"><img src="10 Счастье.jpg"></div>
                <div class="card"><img src="16 Адорн.jpg"></div>
                <div class="card"><img src="11 Пилинг диагностика.jpg"></div>
                <div class="card"><img src="12 Полировка.jpg"></div>
                <div class="card"><img src="14 Стрижка.jpg"></div>
            </div>
        </div>

        <div id="okrash" class="section">
            <div class="section-header"><div class="section-marker"></div><h2>Окрашивание</h2></div>
            <div class="grid">
                <div class="card"><img src="15 Тонирование.jpg"></div>
                <div class="card"><img src="18 Биозавивка.jpg"></div>
            </div>
        </div>

        <div class="footer-note">HairLab · Томск · Красивые волосы без компромиссов</div>
    </main>
</div>

<div id="fabWrapper" class="fab-wrapper">
    <div id="fabMenu" class="fab-menu">
        <button class="fab-option" onclick="openPhone()">
            <svg viewBox="0 0 24 24" fill="#34C759"><path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg>
            Позвонить
        </button>
        <button class="fab-option" onclick="openTelegram()">
            <svg viewBox="0 0 24 24" fill="#0088cc"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 8.1l-1.9 9.1c-.1.7-.5.8-1.1.5l-3.1-2.3-1.5 1.4c-.2.2-.3.3-.6.3l.2-3.1 5.7-5.1c.3-.2-.1-.4-.4-.1l-7 4.4-3-1c-.7-.2-.7-.7.1-1l11.9-4.6c.5-.2 1 .1.9.8z"/></svg>
            Telegram
        </button>
        <button class="fab-option" onclick="openMax()">
            <img src="max-icon.png" alt="Max">
            Max
        </button>
        <button class="fab-option" onclick="openWhatsApp()">
            <svg viewBox="0 0 24 24" fill="#25D366"><path d="M12 0C5.4 0 0 5.4 0 12c0 2.1.5 4.1 1.6 5.9L0 24l6.2-1.6c1.7.9 3.7 1.4 5.8 1.4 6.6 0 12-5.4 12-12S18.6 0 12 0zm0 22c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-3.8 1 1-3.7-.2-.4c-1-1.7-1.5-3.6-1.5-5.6 0-5.5 4.5-10 10-10s10 4.5 10 10-4.5 10-10 10zM16.9 13.4c-.3-.1-1.6-.8-1.8-.9-.2-.1-.4-.1-.6.1l-.8 1c-.2.2-.3.2-.6.1-1.5-.7-2.4-1.3-3.4-2.9-.1-.2 0-.3.1-.4l.3-.4c.1-.1.2-.2.2-.4l-.2-.4c-.1-.1-.8-2-.9-2.2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 1.9 3.1 4.7 4.2 2.8 1 2.8.6 3.3.6.5 0 1.6-.6 1.8-1.3.2-.6.2-1.2.1-1.3z"/></svg>
            WhatsApp
        </button>
        <button class="fab-option" onclick="openInstagram()">
            <svg viewBox="0 0 24 24"><defs><linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f09433"/><stop offset="50%" stop-color="#dc2743"/><stop offset="100%" stop-color="#bc1888"/></linearGradient></defs><path fill="url(#ig)" d="M12 2.1c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.9s0 3.6-.1 4.9c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1s-3.6 0-4.9-.1c-3.2-.1-4.8-1.7-4.9-4.9-.1-1.3-.1-1.6-.1-4.9s0-3.6.1-4.9c.1-3.2 1.7-4.8 4.9-4.9 1.3-.1 1.6-.1 4.9-.1zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 100 12.4 6.2 6.2 0 000-12.4zM12 16a4 4 0 110-8 4 4 0 010 8zm6.4-11.8a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8z"/></svg>
            Instagram
        </button>
    </div>
    <button id="fabMain" class="fab-main"><span>Записаться</span></button>
</div>

<div id="imageModal" class="modal-overlay">
    <div class="modal-inner">
        <button class="modal-close">×</button>
        <button class="modal-nav modal-prev">‹</button>
        <button class="modal-nav modal-next">›</button>
        <img id="modalImage" src="" alt="">
        <div class="modal-hint">Нажмите в любое место, чтобы закрыть</div>
    </div>
</div>

<script>
    const PHONE = "79528883050";

    function openWhatsApp() { window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent("Здравствуйте! Хочу записаться в HairLab.")}`, "_blank"); }
    function openTelegram() { window.open("https://t.me/hairlab_tomsk", "_blank"); }
    function openInstagram() { window.open("https://instagram.com/hairlab_", "_blank"); }
    function openPhone() { window.location.href = `tel:+${PHONE}`; }
    function openMax() { window.open("https://max.ru/u/f9LHodD0cOIlRLZOAOZa-YWwHrQ7eNQtVgbGT8yuzBOVtGVbokoiV5S59JQ", "_blank"); }

    document.addEventListener("DOMContentLoaded", () => {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        const fabWrapper = document.getElementById("fabWrapper");
        
        const thumbs = Array.from(document.querySelectorAll(".intro img, .card img"));
        let curIdx = 0;

        const showImg = (i) => {
            if (i < 0) i = thumbs.length - 1;
            if (i >= thumbs.length) i = 0;
            curIdx = i;
            modalImg.src = thumbs[curIdx].src;
        };

        document.querySelectorAll(".intro, .card").forEach((el, i) => {
            el.onclick = (e) => {
                e.stopPropagation();
                showImg(i);
                modal.classList.add("open");
                document.body.style.overflow = "hidden";
                fabWrapper.style.display = "none";
            };
        });

        modal.onclick = () => {
            modal.classList.remove("open");
            document.body.style.overflow = "";
            fabWrapper.style.display = "flex";
        };

        document.querySelector(".modal-prev").onclick = (e) => { e.stopPropagation(); showImg(curIdx - 1); };
        document.querySelector(".modal-next").onclick = (e) => { e.stopPropagation(); showImg(curIdx + 1); };
        document.querySelector(".modal-close").onclick = (e) => { e.stopPropagation(); modal.onclick(); };

        const fabMain = document.getElementById("fabMain");
        const fabMenu = document.getElementById("fabMenu");
        fabMain.onclick = (e) => { e.stopPropagation(); fabMenu.classList.toggle("open"); };
        document.onclick = () => fabMenu.classList.remove("open");

        const navBtns = document.querySelectorAll(".nav button[data-target]");
        navBtns.forEach(b => {
            b.onclick = () => {
                const target = document.getElementById(b.dataset.target);
                if(target) target.scrollIntoView({ behavior: 'smooth' });
            }
        });

        const obs = new IntersectionObserver(ents => {
            ents.forEach(en => { if(en.isIntersecting) navBtns.forEach(b => b.classList.toggle("active", b.dataset.target === en.target.id)); });
        }, { rootMargin: '-10% 0px -70% 0px', threshold: 0.1 });
        document.querySelectorAll(".section").forEach(s => obs.observe(s));
    });
</script>
</body>
</html>
